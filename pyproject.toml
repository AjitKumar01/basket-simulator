[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-simulator"
version = "0.4.0"
description = "Trainable category-chain basket model with exact within-category subset probabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.16.3", "torch==2.9.1"]

[project.optional-dependencies]
research = ["pandas==2.3.3", "pyarrow>=20,<23"]
dev = ["pytest>=8,<10"]

[project.scripts]
basket-sim = "basket_simulator.__main__:main"
basket-train = "basket_simulator.train:main"
basket-fit = "basket_simulator.pipeline:main"
basket-benchmark = "experiments.__main__:main"

[tool.setuptools.packages.find]
include = ["basket_simulator*", "experiments*"]

[tool.setuptools.package-data]
experiments = ["source_origins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
